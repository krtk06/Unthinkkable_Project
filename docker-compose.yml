services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resume_screener
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
